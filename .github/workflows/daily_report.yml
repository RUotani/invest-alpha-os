name: daily-report

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: daily-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e .
      - name: Generate daily report
        run: alpha-os daily
