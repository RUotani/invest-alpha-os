name: weekly-candidate-brief

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 5"  # Saturday 07:00 JST

concurrency:
  group: weekly-candidate-brief-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-weekly-candidate-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gmail]"
      - name: Generate weekly candidate brief
        run: scripts/run_weekly_candidate_brief.sh
      - name: Resolve report date (JST)
        id: report_date
        run: |
          REPORT_DATE="$(PYTHONPATH=src python -c 'from invis_alpha_os.utils.date_utils import today_jst_iso; print(today_jst_iso())')"
          echo "date=${REPORT_DATE}" >> "${GITHUB_OUTPUT}"
      - name: Send weekly report email
        if: vars.WEEKLY_REPORT_EMAIL_ENABLED == 'true'
        env:
          WEEKLY_REPORT_EMAIL_ENABLED: ${{ vars.WEEKLY_REPORT_EMAIL_ENABLED }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          WEEKLY_REPORT_EMAIL_FROM: ${{ secrets.WEEKLY_REPORT_EMAIL_FROM }}
          WEEKLY_REPORT_EMAIL_TO: ${{ secrets.WEEKLY_REPORT_EMAIL_TO }}
        run: |
          PYTHONPATH=src python -m invis_alpha_os.cli.main weekly-report-email-send \
            --report-date "${{ steps.report_date.outputs.date }}" \
            --report-root "reports/${{ steps.report_date.outputs.date }}" \
            --send \
            --format markdown
      - name: Upload weekly candidate brief artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-candidate-brief
          path: |
            reports/*/weekly_candidate_brief_v0_1.md
            reports/*/weekly_candidate_brief_copy.md
            reports/*/email/*
            outputs/operator/weekly_candidate_brief/*/status.json
