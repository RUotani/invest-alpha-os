version: ops_dev_loop_profiles.v1
profiles:
  smoke_20min:
    max_runtime_minutes: 20
    max_tasks: 2
    max_prs: 1
    wait_ci: false
    ci_timeout_seconds: 600
    ci_poll_seconds: 30
    stop_on_failure: true
    stop_on_dirty_tree: true
  overnight_safe_3h:
    max_runtime_minutes: 180
    max_tasks: 6
    max_prs: 2
    wait_ci: true
    ci_timeout_seconds: 1800
    ci_poll_seconds: 45
    stop_on_failure: true
    stop_on_dirty_tree: true
  overnight_safe_6h:
    max_runtime_minutes: 360
    max_tasks: 10
    max_prs: 3
    wait_ci: true
    ci_timeout_seconds: 2400
    ci_poll_seconds: 60
    stop_on_failure: true
    stop_on_dirty_tree: true
  true_longrun_3h:
    max_runtime_minutes: 180
    max_tasks: 50
    max_prs: 5
    wait_ci: true
    ci_timeout_seconds: 1800
    ci_poll_seconds: 45
    stop_on_failure: true
    stop_on_dirty_tree: true
    min_runtime_minutes: 180
    no_early_success_exit: true
    heartbeat_interval_minutes: 10
    continue_after_pr_limit: heartbeat
    continue_after_task_limit: heartbeat
  true_longrun_6h:
    max_runtime_minutes: 360
    max_tasks: 50
    max_prs: 5
    wait_ci: true
    ci_timeout_seconds: 2400
    ci_poll_seconds: 60
    stop_on_failure: true
    stop_on_dirty_tree: true
    min_runtime_minutes: 360
    no_early_success_exit: true
    heartbeat_interval_minutes: 10
    continue_after_pr_limit: heartbeat
    continue_after_task_limit: heartbeat
  true_longrun_8h:
    max_runtime_minutes: 510
    max_tasks: 100
    max_prs: 10
    wait_ci: true
    ci_timeout_seconds: 3600
    ci_poll_seconds: 60
    stop_on_failure: true
    stop_on_dirty_tree: true
    min_runtime_minutes: 480
    no_early_success_exit: true
    heartbeat_interval_minutes: 10
    continue_after_pr_limit: heartbeat
    continue_after_task_limit: heartbeat
