hard_veto:
  - id: "hard_market_heat"
    metric: "market_heat"
    threshold: 0.9
    message: "Market overheat exceeds hard threshold"
  - id: "hard_momentum_overheat"
    metric: "overheat_flag"
    threshold: 1.0
    message: "Momentum overheat flag triggered (r20 or r60 extreme)"

soft_veto:
  - id: "soft_valuation_stretch"
    metric: "valuation_stretch"
    threshold: 0.65
    message: "Valuation stretch exceeds soft threshold"

fomo_veto:
  - id: "fomo_volume_price_chase"
    metric: "fomo_volume_price_chase"
    threshold: 1.0
    message: "Volume vs 25d prior avg >= 3.0 with r5 > 15% (chase caution)"

