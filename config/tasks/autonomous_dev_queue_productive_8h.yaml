version: ops_dev_queue.v1
description: >
  Productive 8h autonomous queue (16 tasks). Use with true_longrun_8h profile and
  scripts/run_productive_true_longrun_8h.sh. Real dev/docs/tests scopes; no live HTTP.
tasks:
  - task_id: ops_i_evidence_post_run_helper
    pr_title: "R7.0-Ops-I: dev-loop evidence post-run helper docs"
    branch: "work/dev-loop/autonomous/{task_id}/{run_id}"
    scope: "compact post-run summary for latest dev-loop evidence"
    risk_level: "low"
    pytest_cmd: "pytest -q tests/test_operator_dev_loop.py -k evidence"
    change_file: "docs/118_ops_i_productive_8h_queue.md"
    commit_message: "R7.0-Ops-I: evidence post-run helper marker"
    prepare_for_pr: true
    allowed_paths:
      - "docs/"
      - "src/invis_alpha_os/operator/"
      - "tests/"
    forbidden_paths:
      - ".github/workflows/"
      - "Makefile"
      - "pyproject.toml"
      - "outputs/"
    stop_conditions:
      - "forbidden path touched"
  - task_id: ops_i_evidence_readability_keys
    pr_title: "R7.0-Ops-I: evidence summary stable keys"
