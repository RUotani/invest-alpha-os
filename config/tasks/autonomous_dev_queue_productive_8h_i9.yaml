version: ops_dev_queue.v1
description: >
  R7.0-Ops-I9 daytime 8h queue — G1 consolidation, G2 pytest exit 5, G3 terminal-safe scripts.
  Use with PRODUCTIVE_QUEUE=.../autonomous_dev_queue_productive_8h_i9.yaml and true_longrun_8h.
tasks:
  - task_id: ops_i9_pytest_exit5_classification
    pr_title: "R7.0-Ops-I9: pytest exit 5 failure category"
    branch: "work/dev-loop/autonomous/{task_id}/{run_id}"
    scope: "classify pytest exit 5 as pytest_no_tests_collected"
    risk_level: "low"
    pytest_cmd: "pytest -q tests/test_operator_dev_loop.py -k pytest_no_tests_collected"
    change_file: "src/invis_alpha_os/operator/dev_loop.py"
    commit_message: "R7.0-Ops-I9: pytest exit 5 failure category"
    prepare_for_pr: true
    allowed_paths:
      - "src/invis_alpha_os/operator/"
      - "tests/"
    forbidden_paths:
      - ".github/workflows/"
      - "Makefile"
      - "pyproject.toml"
      - "outputs/"

  - task_id: ops_i9_stacked_pr_list_helper
    pr_title: "R7.0-Ops-I9: stacked PR list helper"
    branch: "work/dev-loop/autonomous/{task_id}/{run_id}"
