version: ops_dev_queue.v1
description: >
  Bounded long-run autonomous queue (6 tasks). Use with overnight_safe_3h and
  --max-tasks 6 --max-prs 3. Not for smoke (--max-tasks 1 --max-prs 1).
tasks:
  - task_id: longrun_runbook_anchor
    pr_title: "R7.0-Ops: long-run runbook anchor"
    branch: "work/dev-loop/autonomous/{task_id}/{run_id}"
    scope: "long-run runbook and caps documentation"
    risk_level: "low"
    pytest_cmd: "git diff --check"
    change_file: "docs/112_r7_0_ops_longrun_autonomous_runbook.md"
    commit_message: "R7.0-Ops: long-run runbook anchor marker"
    prepare_for_pr: true
    allowed_paths:
      - "docs/"
    forbidden_paths:
      - "src/"
      - ".github/workflows/"
      - "Makefile"
      - "pyproject.toml"
  - task_id: longrun_evidence_readability
    pr_title: "R7.0-Ops: evidence summary readability notes"
    branch: "work/dev-loop/autonomous/{task_id}/{run_id}"
    scope: "evidence field readability documentation"
    risk_level: "low"
    pytest_cmd: "git diff --check"
    change_file: "docs/113_r7_0_ops_longrun_evidence_readability.md"
