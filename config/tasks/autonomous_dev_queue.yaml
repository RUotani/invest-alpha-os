version: ops_dev_queue.v1
description: >
  Mixed autonomous queue (smoke/mini trial). For true long-run use
  autonomous_dev_queue_longrun.yaml with --max-tasks 6 --max-prs 3 (not --max-tasks 1).
tasks:
  - task_id: docs_status_microfix
    pr_title: "R7.0-Ops-E6: docs/status microfix"
    branch: "work/dev-loop/autonomous/{task_id}/{run_id}"
    scope: "docs/01 development status updates only"
    risk: "low"
    risk_level: "low"
    pytest_cmd: "git diff --check"
    change_file: "docs/01_development_status.md"
    commit_message: "R7.0-Ops-E6: autonomous docs/status microfix marker"
    prepare_for_pr: true
    allowed_commands:
      - "git diff --check"
    allowed_paths:
      - "docs/"
    forbidden_paths:
      - "src/"
      - ".github/workflows/"
      - "Makefile"
      - "pyproject.toml"
    expected_files:
      - "docs/01_development_status.md"
    stop_conditions:
      - "dirty tree unexpected"
      - "forbidden path touched"
  - task_id: runner_evidence_format_polish
    pr_title: "R7.0-Ops-E: runner evidence format polish"
    branch: "work/dev-loop/autonomous/{task_id}/{run_id}"
    scope: "operator runner evidence key naming polish"
    risk: "low"
    risk_level: "low"
    allowed_paths:
      - "src/invis_alpha_os/operator/"
      - "tests/"
      - "docs/"
      - ".agent/"
    forbidden_paths:
      - ".github/workflows/"
      - "Makefile"
      - "pyproject.toml"
    pytest_cmd: "pytest -q tests/test_operator_runner.py tests/test_operator_runner_gated.py tests/test_operator_runner_jquants_wiring.py"
  - task_id: pr_loop_template_polish
    pr_title: "R7.0-Ops-E: PR loop report template polish"
    branch: "work/dev-loop/autonomous/{task_id}/{run_id}"
    scope: "pr loop draft/report template text polish"
    risk: "low"
    risk_level: "low"
    allowed_paths:
      - "src/invis_alpha_os/operator/"
      - "tests/"
      - "docs/"
      - ".agent/"
    forbidden_paths:
      - ".github/workflows/"
      - "Makefile"
      - "pyproject.toml"
    pytest_cmd: "pytest -q tests/test_operator_pr_loop.py"
  - task_id: task_queue_smoke
    pr_title: "R7.0-Ops-E: task queue smoke"
    branch: "work/dev-loop/autonomous/{task_id}/{run_id}"
    scope: "dev-loop queue smoke only"
    risk: "low"
    risk_level: "low"
    allowed_paths:
      - "src/invis_alpha_os/operator/"
      - "tests/"
      - "config/tasks/"
      - "docs/"
      - ".agent/"
    forbidden_paths:
      - ".github/workflows/"
      - "Makefile"
      - "pyproject.toml"
    pytest_cmd: "pytest -q tests/test_operator_dev_loop.py"
