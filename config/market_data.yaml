jp_equity:
  primary: jquants
  fallback: local_csv
  enabled: false

market_data:
  default_adapter: "yfinance"
  adapters:
    yfinance:
      mode: "fallback_prototype"
      note: "Phase 0 only"
    edinet:
      mode: "metadata_stub"
      note: "Future metadata integration"
    sec:
      mode: "metadata_stub"
      note: "Future metadata integration"
    jquants:
      enabled: false
      mode: stub
      primary_source_for: jp_equity
      endpoints_planned:
        - /listed/info
        - /prices/daily_quotes
        - /fins/statements
        - /fins/announcement
      note: "Live HTTP: debug jquants-daily-quotes --live AND env JQUANTS_ALLOW_LIVE_HTTP=true (not jquants-status)"
