jp_equity:
  primary: jquants
  fallback: local_csv
  enabled: false

market_data:
  default_adapter: "yfinance"
  adapters:
    yfinance:
      mode: "fallback_prototype"
      note: "Phase 0 only"
    edinet:
      mode: "metadata_stub"
      note: "Future metadata integration"
    sec:
      mode: "metadata_stub"
      note: "Future metadata integration"
    jquants:
      enabled: false
      # Phase 1a Task 5: V2 GET /equities/bars/daily のボディは normalize_v2_daily_bars_response で
      # data / daily_quotes / bars / results の先頭該当キーが JSON array であることのみ success（空配列→row_count=0）。
      api_version: v2
      auth_method: api_key
      api_key_env: JQUANTS_API_KEY
      api_key_header: x-api-key
      legacy_v1_auth_method: token
      base_url_env: JQUANTS_API_BASE_URL
      enabled_env: JQUANTS_ENABLED
      allow_live_http_env: JQUANTS_ALLOW_LIVE_HTTP
      data_available_from_env: JQUANTS_DATA_AVAILABLE_FROM
      data_available_to_env: JQUANTS_DATA_AVAILABLE_TO
      mode: stub_by_default
      ci_live_http: disabled
      manual_live_http: triple_gate_required
      primary_source_for: jp_equity
      endpoints_planned:
        - /listed/info
        - /prices/daily_quotes
        - /fins/statements
        - /fins/announcement
      planned_v2_endpoints:
        - /equities/master
        - /equities/bars/daily
        - /equities/bars/daily/am
        - /equities/investor-types
        - /markets/margin-interest
      note: "V2 live: JQUANTS_ENABLED + --live + JQUANTS_ALLOW_LIVE_HTTP + base URL + JQUANTS_API_KEY (x-api-key). CI / make verify: no live HTTP. Task 6: debug jquants-watchlist-bars reads config/watchlist.yaml jp_watchlist."
